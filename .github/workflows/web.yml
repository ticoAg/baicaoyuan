name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/snapshot/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'data/snapshot/**', '.github/workflows/web.yml']
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 静态文件数不能超过 Cloudflare 免费额度（20,000）
        run: |
          n=$(find dist/client -type f | wc -l)
          echo "静态文件 $n 个"
          test "$n" -lt 19000
      # 只在 main 上、且仓库配置了 Cloudflare 凭据时部署：先把数据增量同步到 D1，再发布代码
      - name: 同步数据并部署到 Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm run db:remote
          npx wrangler deploy
