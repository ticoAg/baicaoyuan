# 安卓 App（mobile/）：PR 里检查能不能构建；推送版本 tag 时构建签名的 APK，发布到 GitHub Release。
# 不用本地 git 也能发布：手动运行，选 main，填 tag 和说明。
# 流程、版本号规则、签名密钥的设置见 mobile/README.md。
name: Android

on:
  pull_request:
    paths:
      - mobile/**
      - web/src/lib/** # 和网站共用的代码
      - .github/workflows/android.yml
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  # 在分支上运行：用正式密钥构建，APK 留在运行记录里，不发布。在 tag 上运行：补发这个 tag 的 Release。
  # 在 main 上运行并填了 tag：在 main 最新的提交上打附注 tag，再在这个 tag 上运行一次，发布 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: 发布新版本时填，如 v1.2.3；只能在 main 上用
        required: false
        default: ''
      message:
        description: 新版本 tag 的说明，放在发布说明最前面
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: 类型检查，lint
        run: |
          npm run typecheck
          npm run lint
      - name: 构建 release 包，用 debug 密钥签名
        run: npm run apk

      - uses: actions/upload-artifact@v6
        with:
          name: baicaoyuan-pr${{ github.event.pull_request.number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  tag:
    name: 打 tag
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 推 tag
      actions: write # 在 tag 上再运行一次本工作流
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: 核对 tag 和说明
        env:
          TAG: ${{ inputs.tag }}
          MESSAGE: ${{ inputs.message }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ $GITHUB_REF != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::发布新版本只能在 $DEFAULT_BRANCH 上运行。要补发已有 tag 的 Release，选那个 tag 运行，不填 tag"
            exit 1
          fi
          # 规则同 mobile/app.config.ts 的 versionCode；不合规则的 tag 推上去也构建不了
          re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$'
          if ! [[ $TAG =~ $re ]]; then
            echo "::error::tag 要写成 v1.2.3，或 v1.2.3-alpha.1、v1.2.3-beta.1、v1.2.3-rc.1"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]} n=${BASH_REMATCH[6]}
          if (( 10#$major > 2000 || 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::主版本号不能超过 2000，次版本号、修订号不能超过 99"
            exit 1
          fi
          if [[ -n $n ]] && (( 10#$n < 1 || 10#$n > 29 )); then
            echo "::error::预发布序号只能是 1 到 29"
            exit 1
          fi
          if [[ -z ${MESSAGE//[[:space:]]/} ]]; then
            echo "::error::要写 tag 的说明"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG 已经有了。要补发它的 Release，选这个 tag 运行，不填 tag"
            exit 1
          fi

      - name: 打附注 tag，推上去，在 tag 上运行
        env:
          TAG: ${{ inputs.tag }}
          MESSAGE: ${{ inputs.message }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "$MESSAGE" | git tag --annotate --cleanup=whitespace --file=- "$TAG"
          git push origin "refs/tags/$TAG"
          # 用 GITHUB_TOKEN 推的 tag 不会触发 push 事件，要手动在 tag 上运行
          gh workflow run android.yml --ref "$TAG"
          echo "已在 $(git rev-parse --short HEAD) 上打 $TAG。构建和发布在 tag 上的那次运行里。" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建
    # 填了 tag 的手动运行只打 tag，构建和发布在 tag 上的那次运行里
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      cert: ${{ steps.apk.outputs.cert }}
      min-sdk: ${{ steps.apk.outputs.min-sdk }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 版本号
        run: |
          # tag v1.2.3 → 1.2.3；不在 tag 上时是 0.0.0-dev。生成安卓工程和打包 JS 时都由 app.config.ts 读取
          if [[ $GITHUB_REF_TYPE == tag ]]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-dev; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: 签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::缺少 secret：${missing[*]}。设置方法见 mobile/README.md"
            exit 1
          fi
          base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"

      - run: npm ci
      - name: 构建签名的 APK
        env:
          BCY_KEYSTORE: ${{ runner.temp }}/release.jks
          BCY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # 别名不放 secret：runner 会丢掉含 secret 值的 job 输出，输出 apk（baicaoyuan-1.2.3.apk）含别名
          BCY_KEY_ALIAS: baicaoyuan
          BCY_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} # PKCS12 的密钥密码就是密钥库密码
        run: npm run apk

      - name: 核对版本号和签名，按版本号命名
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          versions=("$ANDROID_HOME"/build-tools/*/)
          tools=$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)
          badging=$("${tools}aapt2" dump badging "$apk")
          head -n 1 <<<"$badging"
          if ! grep -qF "versionName='$APP_VERSION'" <<<"$badging"; then
            echo "::error::APK 的版本号不是 $APP_VERSION"
            exit 1
          fi
          certs=$("${tools}apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -qF 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK 是用 debug 密钥签的"
            exit 1
          fi
          # apksigner 36 写“Signer #1 certificate SHA-256 digest:”，37 起写“V2 Signer: certificate SHA-256 digest:”
          cert=$(grep -m 1 'certificate SHA-256 digest: ' <<<"$certs" | sed 's/.*digest: //' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          min_sdk=$(sed -n "s/^minSdkVersion:'\([0-9]*\)'$/\1/p" <<<"$badging")
          if [[ -z $cert || -z $min_sdk ]]; then
            echo "::error::从 APK 读不出签名证书或 minSdk，apksigner、aapt2 的输出格式可能又变了"
            exit 1
          fi
          name=baicaoyuan-$APP_VERSION.apk
          mkdir -p "$RUNNER_TEMP/dist"
          mv "$apk" "$RUNNER_TEMP/dist/$name"
          {
            echo "name=$name"
            echo "cert=$cert"
            echo "min-sdk=$min_sdk"
          } >> "$GITHUB_OUTPUT"
          echo "$name · 签名证书 SHA-256 $cert" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 建 Release、上传 APK、生成改动列表
      id-token: write # 下面两项给构建来源证明
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 要所有 tag，找上一个版本

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ needs.build.outputs.apk }}

      - name: 写发布说明，发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK: dist/${{ needs.build.outputs.apk }}
          CERT_SHA256: ${{ needs.build.outputs.cert }}
          MIN_SDK: ${{ needs.build.outputs.min-sdk }}
        run: |
          # 附注 tag 的说明要从 tag 对象里读，重新取一次原样的 tag
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          python3 .github/scripts/release_notes.py "$TAG" "$APK" > "$RUNNER_TEMP/notes.md"
          version=${TAG#v}
          args=(--title "百草园 $version" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ $version == *-* ]]; then args+=(--prerelease); fi
          # 重跑时 Release 已经在了：换掉 APK，更新正文
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" "$APK" --verify-tag "${args[@]}"
          fi
