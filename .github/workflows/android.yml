# Android 应用：PR 里检查能不能构建；推送版本 tag 时构建签名的 APK，发布到 GitHub Release。
# 流程、版本号规则、签名密钥的设置见 android/README.md。
name: Android

on:
  pull_request:
    paths:
      - android/**
      - .github/workflows/android.yml
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  # 在分支上运行：用正式密钥构建，APK 留在运行记录里，不发布。在 tag 上运行：补发这个 tag 的 Release。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # 开源的缓存实现；默认的 enhanced 是专有组件

      - name: lint，构建 debug 包和不签名的 release 包
        run: ./gradlew lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v6
        with:
          name: baicaoyuan-pr${{ github.event.pull_request.number }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build:
    name: 构建
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android
    outputs:
      apk: ${{ steps.apk.outputs.name }}
      cert: ${{ steps.apk.outputs.cert }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # 开源的缓存实现；默认的 enhanced 是专有组件

      - name: 版本号
        run: |
          # tag v1.2.3 → 1.2.3；不在 tag 上时是 0.0.0-dev
          if [[ $GITHUB_REF_TYPE == tag ]]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-dev; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: 签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::缺少 secret：${missing[*]}。设置方法见 android/README.md"
            exit 1
          fi
          base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"

      - name: 构建签名的 APK
        env:
          BCY_KEYSTORE: ${{ runner.temp }}/release.jks
          BCY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BCY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BCY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersion="$APP_VERSION"

      - name: 核对签名，按版本号命名
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=("$ANDROID_HOME"/build-tools/*/)
          apksigner=$(printf '%s\n' "${tools[@]}" | sort -V | tail -n 1)apksigner
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$certs" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          name=baicaoyuan-$APP_VERSION.apk
          mkdir -p dist
          mv "$apk" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "$name · 签名证书 SHA-256 $cert" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: android/dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 建 Release、上传 APK、生成改动列表
      id-token: write # 下面两项给构建来源证明
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 要所有 tag，找上一个版本

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ needs.build.outputs.apk }}

      - name: 写发布说明，发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK: dist/${{ needs.build.outputs.apk }}
          CERT_SHA256: ${{ needs.build.outputs.cert }}
        run: |
          # 附注 tag 的说明要从 tag 对象里读，重新取一次原样的 tag
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          python3 .github/scripts/release_notes.py "$TAG" "$APK" > "$RUNNER_TEMP/notes.md"
          version=${TAG#v}
          args=(--title "百草园 $version" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ $version == *-* ]]; then args+=(--prerelease); fi
          # 重跑时 Release 已经在了：换掉 APK，更新正文
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" "$APK" --verify-tag "${args[@]}"
          fi
